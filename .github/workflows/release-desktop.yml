name: Release desktop

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: Build and publish Windows installer
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify tag matches desktop version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Tag inválido: $tag. Usá semver vX.Y.Z"
          }
          $expected = $Matches[1]
          $actual = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ($actual -ne $expected) {
            throw "El tag v$expected no coincide con apps/desktop/package.json ($actual). Alineá la versión antes de tagear."
          }
          Write-Host "Release desktop $actual OK"

      - name: Build shared, API and web
        run: npm run build

      - name: API storage tests
        run: npm run test:storage -w @termometro/api

      - name: API local-flow tests
        run: npm run test:local-flow -w @termometro/api

      - name: Desktop unit tests
        run: npm run test -w @termometro/desktop

      - name: Package Windows installer
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        run: |
          $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
          if ($env:CSC_LINK -or $env:WIN_CSC_LINK) {
            $env:TERMOMETRO_UPDATE_URL = 'https://github.com/lpleoped/termometro/releases/latest/download/'
            Write-Host 'Canal de actualizaciones firmado habilitado.'
          } else {
            Remove-Item Env:TERMOMETRO_UPDATE_URL -ErrorAction SilentlyContinue
            Write-Host 'Sin certificado: instalador publicado sin canal de auto-update.'
          }
          npm run package:win -w @termometro/desktop

      - name: Locate artifacts
        id: artifacts
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $dir = "apps/desktop/release-$version"
          if (-not (Test-Path $dir)) { throw "No existe $dir" }
          Get-ChildItem $dir | Select-Object Name, Length
          "dir=$dir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Termómetro de Equipo ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## Instalador Windows

            Descargá `Termometro-de-Equipo-Setup-*.exe` desde los assets de este release.

            - Licencia: Apache-2.0
            - Canal de auto-update: solo si el build fue firmado con certificado de código
            - Los datos locales del usuario no se borran al actualizar con el instalador

            Guía: [RELEASE.md](https://github.com/lpleoped/termometro/blob/main/RELEASE.md)
          files: |
            ${{ steps.artifacts.outputs.dir }}/*.exe
            ${{ steps.artifacts.outputs.dir }}/*.blockmap
            ${{ steps.artifacts.outputs.dir }}/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
